name: Build Llama.cpp Vulkan Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp
          ref: master
          
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          
      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt update
          sudo apt install -y vulkan-sdk ninja-build
          
      - name: Prepare Vulkan C++ Headers
        run: |
          mkdir -p vulkan_inc
          cp -r /usr/include/vulkan vulkan_inc/
          cp -r /usr/include/vk_video vulkan_inc/
          cp -r /usr/include/spirv vulkan_inc/

      - name: Build llama.cpp
        run: |
          mkdir build
          cd build
          cmake .. -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/vulkan_inc" \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_TOOLS=OFF
          ninja bin/libllama.so bin/libggml.so bin/libggml-base.so bin/libggml-cpu.so bin/libggml-vulkan.so
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-vulkan-android
          path: |
            build/bin/libllama.so
            build/bin/libggml.so
            build/bin/libggml-base.so
            build/bin/libggml-cpu.so
            build/bin/libggml-vulkan.so
